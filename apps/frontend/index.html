<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WISEShift - Professional Self-Assessment Tool for Work Integration Social Enterprises. Evaluate your WISE across 9 domains grounded in EMES indicators." />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="robots" content="index, follow" />

    <meta name="twitter:card" content="summary" />

  <body class="bg-gray-50 text-gray-900 antialiased">
    <!-- Prevent dark mode flash: apply dark class before React renders -->
    <script>
      try {
        var ui = JSON.parse(localStorage.getItem('wiseshift-ui') || '{}');
        if (ui.state && ui.state.darkMode) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
